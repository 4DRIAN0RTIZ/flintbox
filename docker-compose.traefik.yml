services:
  flintbox:
    build: .
    read_only: true
    tmpfs:
      - /tmp:size=10m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flintbox.rule=Host(`${SUBDOMAIN:-flintbox}.${DOMAIN}`)"
      - "traefik.http.routers.flintbox.entrypoints=web,websecure"
      - "traefik.http.routers.flintbox.tls=true"
      - "traefik.http.services.flintbox.loadbalancer.server.port=3000"
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
