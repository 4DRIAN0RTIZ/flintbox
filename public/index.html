<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FlintBox</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link
		href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;500&family=Oxanium:wght@300;400;600;700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="/css/main.css">
	<link rel="icon" type="image/svg+xml" href="LogoFlintBoxReal.png">
</head>

<body>

	<div class="app">

		<!-- ══ HEADER ══════════════════════════════════════════ -->
		<header class="header">
			<div class="header-brand">
				<!-- <span class="brand-slash">//</span> -->
				<img src="LogoFlintBoxReal.png" alt="FlintBox logo" class="brand-logo">
				<span class="brand-name">FlintBox</span>
			</div>
			<div class="header-right">
				<span class="secure-tag">Secure Sandbox</span>
				<a href="https://github.com/4drian0rtiz" target="_blank" rel="noopener noreferrer" class="github-link" title="@4drian0rtiz on GitHub">
					<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
						<path d="M12 2C6.477 2 2 6.637 2 12.272c0 4.538 2.875 8.378 6.839 9.733.5.09.683-.223.683-.497 0-.245-.009-.898-.014-1.762-2.782.622-3.369-1.37-3.369-1.37-.455-1.182-1.111-1.497-1.111-1.497-.909-.639.069-.627.069-.627 1.004.073 1.532 1.06 1.532 1.06.892 1.56 2.341 1.109 2.91.848.09-.663.35-1.109.636-1.365-2.222-.259-4.56-1.136-4.56-5.059 0-1.118.39-2.032 1.03-2.749-.103-.259-.447-1.302.098-2.713 0 0 .84-.272 2.75 1.051A9.22 9.22 0 0112 6.84c.85.004 1.705.116 2.504.341 1.909-1.323 2.748-1.051 2.748-1.051.546 1.411.202 2.454.1 2.713.64.717 1.028 1.631 1.028 2.749 0 3.935-2.345 4.797-4.572 5.049.359.319.678.947.678 1.909 0 1.378-.013 2.49-.013 2.828 0 .277.18.592.688.491C19.127 20.647 22 16.807 22 12.272 22 6.637 17.523 2 12 2z"/>
					</svg>
					<span>@4drian0rtiz</span>
				</a>
				<div class="status-dot" title="Container running"></div>
			</div>
		</header>

		<!-- ══ TOOL TABS ════════════════════════════════════════ -->
		<nav class="tool-tabs" role="tablist" aria-label="Select tool">
			<button class="tab active" data-tool="jq" role="tab" aria-selected="true">jq</button>
			<button class="tab" data-tool="grep" role="tab">grep</button>
			<button class="tab" data-tool="sed" role="tab">sed</button>
			<button class="tab" data-tool="awk" role="tab">awk</button>
			<button class="tab" data-tool="cut" role="tab">cut</button>
		</nav>

		<!-- ══ CONTROL ROW ══════════════════════════════════════ -->
		<div class="control-row">
			<span class="ctrl-label" id="ctrl-label">filter</span>
			<input id="params" class="ctrl-input" type="text" autocomplete="off" spellcheck="false"
				placeholder=".[] | .name" aria-label="Command parameters">
			<button id="help-btn" class="help-btn" aria-expanded="false" title="Show tool help">? Help</button>
			<button id="run-btn" class="run-btn" title="Run (Ctrl+Enter)">
				<span class="run-label">Run</span>
				<kbd class="run-kbd">⌃↵</kbd>
			</button>
		</div>

		<!-- ══ COMMAND PREVIEW BAR ══════════════════════════════ -->
		<div class="cmd-bar" aria-live="polite" aria-label="Assembled command preview">
			<span class="cmd-ps">$</span>
			<span class="cmd-tool" id="cmd-tool">jq</span>
			<span class="cmd-params" id="cmd-params"></span>
			<span class="cmd-redir">&lt;</span>
			<span class="cmd-stdin">stdin</span>
		</div>

		<!-- ══ WORKSPACE ════════════════════════════════════════ -->
		<div class="workspace">

			<!-- Input pane -->
			<div class="pane pane-in">
				<div class="pane-head">
					<span class="pane-title">Input</span>
					<!-- Source mode toggle: text | http -->
					<div class="src-tabs" role="tablist" aria-label="Input source">
						<button class="src-tab active" data-src="text" role="tab">text</button>
						<button class="src-tab" data-src="http" role="tab">http</button>
					</div>
					<span class="pane-meta" id="line-count">0 lines</span>
					<span class="json-lint" id="json-lint" hidden></span>
					<button class="json-fmt-btn" id="json-fmt-btn" hidden>Format</button>
				</div>

				<!-- ── HTTP panel (hidden by default) ── -->
				<div id="http-panel" class="http-panel" hidden>

					<!-- curl / fields sub-tabs -->
					<div class="http-mode-bar">
						<span class="http-mode-label">Mode</span>
						<div class="http-mode-tabs" role="tablist">
							<button class="http-tab active" data-mode="fields" role="tab">fields</button>
							<button class="http-tab" data-mode="curl" role="tab">curl</button>
						</div>
					</div>

					<!-- Fields mode -->
					<div id="http-fields-panel" class="http-fields">

						<!-- Method + URL -->
						<div class="http-request-row">
							<select id="http-method" class="http-method-select" aria-label="HTTP method">
								<option>GET</option>
								<option>POST</option>
								<option>PUT</option>
								<option>PATCH</option>
								<option>DELETE</option>
								<option>HEAD</option>
							</select>
							<input id="http-url" class="http-url-input" type="url"
								placeholder="https://api.example.com/endpoint" autocomplete="off" spellcheck="false"
								aria-label="Request URL">
						</div>

						<!-- Headers -->
						<div class="http-section">
							<span class="http-section-label">Headers</span>
							<div id="http-headers-list"></div>
							<button id="http-add-header" class="http-add-header-btn">+ Add header</button>
						</div>

						<!-- Body (hidden for GET/HEAD) -->
						<div id="http-body-section" class="http-section" hidden>
							<span class="http-section-label">Body</span>
							<textarea id="http-body" class="http-body-textarea" spellcheck="false"
								placeholder='{"key": "value"}' aria-label="Request body"></textarea>
						</div>

					</div><!-- /http-fields-panel -->

					<!-- Curl mode -->
					<div id="http-curl-panel" class="http-curl-panel" hidden>
						<textarea id="http-curl-input" class="http-curl-textarea" spellcheck="false" placeholder="curl -X POST https://api.example.com/data \
  -H 'Content-Type: application/json' \
  -d '{&quot;name&quot;: &quot;Alice&quot;}'" aria-label="curl command"></textarea>
					</div>

					<!-- Fetch action bar -->
					<div class="http-action-bar">
						<button id="http-fetch-btn" class="http-fetch-btn">Fetch</button>
						<div class="http-fetch-spinner" id="http-fetch-spinner"></div>
						<span class="http-fetch-status" id="http-fetch-status"></span>
					</div>

				</div><!-- /http-panel -->

				<!-- Main input textarea (always visible, populated by fetch or typed manually) -->
				<textarea id="input-data" class="code-area" spellcheck="false" placeholder="Paste your data here…"
					aria-label="Input data"></textarea>
			</div>

			<!-- Divider -->
			<div class="pane-divider" aria-hidden="true">
				<div class="divider-track"></div>
				<span class="divider-arrow" id="divider-arrow">→</span>
			</div>

			<!-- Output pane -->
			<div class="pane pane-out">
				<div class="pane-head">
					<span class="pane-title">Output</span>
					<div class="pane-actions">
						<div class="spinner" id="spinner" aria-label="Running…"></div>
						<span class="exec-timer" id="exec-timer"></span>
						<span class="exit-badge" id="exit-badge" role="status"></span>
						<button class="copy-btn" id="copy-btn">Copy</button>
					</div>
				</div>

				<div class="output-wrap">
					<pre class="output-pre empty" id="output-data" aria-label="Command output" aria-live="polite">Result
						will appear here…</pre>
				</div>

				<div class="stderr-strip" id="stderr-strip" aria-live="polite" role="alert"></div>
			</div>

		</div><!-- /workspace -->

		<!-- ══ HISTORY BAR ══════════════════════════════════════ -->
		<div class="history-bar" id="history-bar" aria-label="Command history">
			<span class="hist-label">Recent</span>
			<div class="hist-chips" id="hist-chips"></div>
		</div>

	</div><!-- /app -->

	<!-- ══ HELP DRAWER ══════════════════════════════════════ -->
	<div class="help-backdrop" id="help-backdrop" aria-hidden="true"></div>

	<aside class="help-drawer" id="help-drawer" role="complementary" aria-label="Tool help" aria-hidden="true">
		<div class="help-drawer-head">
			<span class="help-drawer-title" id="help-title">Help</span>
			<button class="help-close" id="help-close" aria-label="Close help">✕</button>
		</div>
		<div class="help-loading" id="help-loading">Loading help…</div>
		<div class="help-body" id="help-body" aria-live="polite"></div>
	</aside>

	<script type="module" src="/js/main.js"></script>
</body>

<!-- ══ Que estas viendo, no hay easter eggs por aqui ══ -->
<!-- ══ O si? ══ -->

</html>
