<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#252525"/>
      <stop offset="100%" stop-color="#1c1c1c"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="90" ry="90" fill="url(#bg)"/>

  <!-- Chevron > -->
  <!-- Built from two thick lines forming a > shape -->
  <polyline
    points="130,185 230,256 130,327"
    fill="none"
    stroke="#e38528"
    stroke-width="52"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Underscore / cursor _ -->
  <line
    x1="265" y1="318"
    x2="385" y2="318"
    stroke="#e38528"
    stroke-width="48"
    stroke-linecap="round"
  />

  <!-- "Playground" label -->
  <text
    x="256"
    y="430"
    font-family="'SF Mono', 'Fira Code', 'Courier New', monospace"
    font-size="48"
    font-weight="600"
    fill="#e38528"
    opacity="0.85"
    text-anchor="middle"
    letter-spacing="2"
  >Playground</text>
</svg>